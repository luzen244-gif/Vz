
name: StarDesk Windows VM

on:
  workflow_dispatch:

jobs:
  stardesk:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install StarDesk
        shell: powershell
        run: |
          $installer = "$env:GITHUB_WORKSPACE\installers\StarDesk.exe"

          if (-not (Test-Path $installer)) {
            throw "StarDesk installer not found: $installer"
          }

          Start-Process -FilePath $installer -ArgumentList "/S" -Wait

      - name: Start StarDesk
        shell: powershell
        run: |
          $paths = @(
            "$env:ProgramFiles\StarDesk\StarDesk.exe",
            "$env:ProgramFiles(x86)\StarDesk\StarDesk.exe"
          )

          $app = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1

          if ($app) {
            Start-Process $app
            Write-Host "StarDesk started."
          } else {
            Write-Host "Locate StarDesk executable and update the path."
          }

      - name: Keep workflow alive
        shell: powershell
        run: |
          $end = (Get-Date).AddHours(6)

          while ((Get-Date) -lt $end) {
            Write-Host "StarDesk workflow running: $(Get-Date)"
            Start-Sleep -Seconds 300
          }
          
